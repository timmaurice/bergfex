name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_FILE: test/e2e/docker-compose.yml

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build card
        run: npm run build

      - name: Start Home Assistant
        run: docker compose up -d

      - name: Wait for Home Assistant
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8135/manifest.json; then
              echo "Home Assistant answered after ~$((attempt * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Home Assistant did not answer on port 8135 within 450s"
          docker compose logs --tail 100
          exit 1

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Show Home Assistant log
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop Home Assistant
        if: always()
        run: docker compose down
