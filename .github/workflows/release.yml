name: Create Release

on:
  push:
    tags:
      - "*"

# A re-pushed tag should supersede the run it replaces, not race it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The card ships inside the archive, so a stale or failing build must stop
      # the release rather than quietly producing one without it.
      - name: Build Lovelace card
        run: npm run build

      # Refuses to build when the manifest version disagrees with the tag, when a
      # required file is missing, or when test fixtures, caches or bytecode would
      # reach users. See scripts/build-release-zip.mjs.
      - name: Build and verify HACS archive
        run: npm run build:release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: "Version ${{ env.VERSION }}"
          draft: true
          # The release notes are written by hand. `generate_release_notes: true`
          # appended GitHub's own PR list on top of them, and appended it again on
          # every re-pushed tag - so a release that had been tidied up grew a
          # second copy the next time the tag moved. Set it back to true if you
          # would rather have the generated list than a hand-written body.
          generate_release_notes: false
          files: bergfex.zip
