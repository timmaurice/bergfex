name: Live Website Check

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 02:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # No Home Assistant here: this job installs requirements.txt only, so
          # nothing pins a core and there is no resolution to drift. 3.14 is for
          # parity with the test job - the scripts share the integration's parser,
          # and running them on an interpreter the suite never exercises would let
          # a 3.14-only break reach a scheduled, unwatched run.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiohttp

      # Fails on a keyword mismatch, on missing year-round structure, and on a
      # missing snow report during the season. Off-season it reports the snow
      # report as unverifiable without failing - see scripts/check_live_site.py.
      - name: Run Live Site Validation
        run: PYTHONPATH=. python scripts/check_live_site.py
