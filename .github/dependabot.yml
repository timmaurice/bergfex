version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/"
    # The floors in requirements.txt are mirrored into manifest.json, and hassfest rejects a
    # floor above the version Home Assistant pins (beautifulsoup4==4.13.3, lxml==6.1.2 in core).
    # Raising them on every release broke validation, so only move a requirement when a
    # release falls outside it.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    # TypeScript 7 is deliberately held back: `typescript-eslint` still declares
    # `peer typescript: >=4.8.4 <6.1.0`, so a grouped bump that carries TypeScript 7 cannot be
    # installed at all - `npm ci` aborts on the peer conflict and the whole group is stuck.
    # Drop this once typescript-eslint supports it.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"
