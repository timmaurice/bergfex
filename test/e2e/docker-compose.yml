# The Home Assistant the e2e suite runs against. It is deliberately separate
# from any hand-kept playground: it starts from the tracked configuration in
# ./ha-config, the suite onboards it through the API (see global-setup.ts), and
# everything else it writes into ./ha-config is gitignored.
#
# Behind a TLS-inspecting proxy, add a gitignored docker-compose.override.yml
# beside this file (see CONTRIBUTING.md); the suite picks it up when present.
name: bergfex-e2e
services:
  homeassistant:
    image: homeassistant/home-assistant:2026.11.1
    volumes:
      - ./ha-config:/config
      # The integration serves its own card from this folder, so mounting it
      # brings the built bundle along: no /local resource to register.
      - ../../custom_components/bergfex:/config/custom_components/bergfex
    ports:
      - '8135:8123'
